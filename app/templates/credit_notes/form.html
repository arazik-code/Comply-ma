{% extends "base.html" %}
{% block page_title %}Nouvel avoir{% endblock %}
{% block content %}
<div class="page-header">
  <h1>Nouvel avoir</h1>
</div>

<div class="card" style="max-width:600px">
  <form method="post" action="/credit-notes/">
    <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
    <div class="form-group">
      <label>Facture originale *</label>
      <select name="original_invoice_id" required>
        <option value="">&mdash; S&eacute;lectionnez une facture &mdash;</option>
        {% for inv in invoices %}
        <option value="{{ inv.id }}">{{ inv.invoice_number or '(brouillon)' }} ({{ inv.invoice_date.strftime('%d/%m/%Y') }})</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label>Date de l'avoir *</label>
      <input type="date" name="credit_note_date" value="{{ now().strftime('%Y-%m-%d') }}" required>
    </div>
    <div class="form-group">
      <label>Motif *</label>
      <textarea name="reason" rows="3" required placeholder="Ex: Retour de marchandise, erreur de facturation..."></textarea>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Cr&eacute;er l'avoir</button>
      <a href="/credit-notes" class="btn btn-secondary">Annuler</a>
    </div>
  </form>
</div>
{% endblock %}
