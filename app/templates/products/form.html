{% extends "base.html" %}
{% block page_title %}{{ t('nav.products') }} &mdash; {{ 'Modifier' if product else 'Nouveau' }}{% endblock %}
{% block content %}
<div class="page-header">
  <h1>{{ t('nav.products') }} &mdash; {{ 'Modifier' if product else 'Nouveau' }}</h1>
</div>

<div class="card">
  <form method="post" action="/products/{{ product.id if product else '' }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
    <div class="form-row">
      <div class="form-group">
        <label>{{ t('product.name') }} *</label>
        <input type="text" name="name" value="{{ product.name if product else '' }}" required>
      </div>
      <div class="form-group">
        <label>R&eacute;f&eacute;rence</label>
        <input type="text" name="reference" value="{{ product.reference if product else '' }}">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>{{ t('product.price') }} *</label>
        <input type="number" step="0.01" name="unit_price" value="{{ "%.2f"|format(product.unit_price) if product else '' }}" required>
      </div>
      <div class="form-group">
        <label>{{ t('product.tva') }} *</label>
        <select name="tva_rate_id">
          {% for rate in tva_rates %}
          <option value="{{ rate.id }}" {% if product and product.tva_rate_id == rate.id %}selected{% endif %}>
            {{ rate.label }} ({{ "%.0f"|format(rate.rate * 100) }}%)
          </option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>Unit&eacute;</label>
        <input type="text" name="unit" value="{{ product.unit if product else 'pi&egrave;ce' }}">
      </div>
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea name="description">{{ product.description if product else '' }}</textarea>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">{{ t('common.save') }}</button>
      <a href="/products" class="btn btn-secondary">{{ t('common.cancel') }}</a>
    </div>
  </form>
</div>
{% endblock %}
