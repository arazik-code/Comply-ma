{% extends "base.html" %}
{% block page_title %}Client{% endblock %}
{% block content %}
<div class="page-header">
  <h1>{{ 'Modifier' if client else 'Nouveau' }} client</h1>
</div>

<div class="card" style="max-width:600px">
  <form method="post" action="/clients/{{ client.id if client else '' }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
    <div class="form-row">
      <div class="form-group">
        <label>Raison sociale *</label>
        <input type="text" name="name" value="{{ client.name if client else '' }}" required>
      </div>
      <div class="form-group">
        <label>ICE</label>
        <input type="text" name="ice" value="{{ client.ice if client else '' }}">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>RC</label>
        <input type="text" name="rc" value="{{ client.rc if client else '' }}">
      </div>
      <div class="form-group">
        <label>I.F.</label>
        <input type="text" name="if_number" value="{{ client.if_number if client else '' }}">
      </div>
    </div>
    <div class="form-group">
      <label>Adresse</label>
      <textarea name="address">{{ client.address if client else '' }}</textarea>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Ville</label>
        <input type="text" name="city" value="{{ client.city if client else '' }}">
      </div>
      <div class="form-group">
        <label>T&eacute;l&eacute;phone</label>
        <input type="text" name="phone" value="{{ client.phone if client else '' }}">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" value="{{ client.email if client else '' }}">
      </div>
    </div>
    <div style="margin-top:1.5rem;padding-top:1.5rem;border-top:2px solid var(--border)">
      <h3 style="font-size:0.82rem;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:0.75rem">Portail client</h3>
      <p style="font-size:0.78rem;color:var(--text-muted);margin-bottom:0.75rem">
        Activez l'accès au portail pour que ce client puisse consulter ses factures et avoirs en ligne.
      </p>
      <div class="form-row">
        <div class="form-group">
          <label style="display:flex;align-items:center;gap:0.5rem;cursor:pointer">
            <input type="checkbox" name="portal_enabled" value="1" {% if client and client.portal_enabled %}checked{% endif %}>
            Activer le portail
          </label>
        </div>
        <div class="form-group">
          <label>Mot de passe portail</label>
          <input type="password" name="portal_password" placeholder="{% if client and client.portal_enabled %}Laisser vide pour conserver l'actuel{% else %}Définir un mot de passe{% endif %}">
        </div>
      </div>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Enregistrer</button>
      <a href="/clients" class="btn btn-secondary">Annuler</a>
    </div>
  </form>
</div>
{% endblock %}
